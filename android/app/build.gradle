plugins {
    id 'com.android.application'
    id 'com.chaquo.python' version '17.1.0'
}

def brainnRoot = file("../../")

android {
    namespace 'com.ganfanyu.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.ganfanyu.app"
        minSdk 24
        targetSdk 34
        versionCode 123
        versionName "9.10"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // OpenCV AAR 自带的人脸/轮廓模型（blazeface/fssd/emd）在本项目里没有任何调用，
        // 直接忽略 assets 目录，避免 APK 里多带 4MB
        ignoreAssetsPattern "!models_bundled"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.13"
        buildPython "C:/veighna_studio/python.exe"
        pip {
            install "httpx==0.28.1"
            install "websockets"
            install "PyYAML"
            install "beautifulsoup4"
            install "Pillow"
            install "tzdata"
        }
    }
}

tasks.register("syncPython", Copy) {
    from(new File(brainnRoot, "brainn")) {
        include "**/*.py"
        exclude "**/__pycache__/**"
        into "brainn"
    }
    from(new File(brainnRoot, "main.py"))
    from(new File(brainnRoot, "mobile_server.py"))
    into "src/main/python"
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    // AR 模式里用来跟脸：WorldCallController 调用
    implementation "com.google.mlkit:face-detection:16.1.6"
    // QR/平面标记锚定：离线识别二维码四角，不需要 GMS
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    // 无标记平面跟踪：光流 + 单应，把桌宠钉在点击的那块平面上
    implementation "org.opencv:opencv:4.11.0"
    // AR 桌宠：平面锚定。设备不支持或未安装 Google Play Services for AR 时，
    // ArPetActivity 会自动回退到 CameraX 的轻量 AR。
    implementation "com.google.ar:core:1.45.0"
}

tasks.named("preBuild") {
    dependsOn "syncPython"
}

tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }.configureEach {
    dependsOn "syncPython"
}


