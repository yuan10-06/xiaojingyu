<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小鲸鱼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --safe-top: 0px; --safe-bottom: 0px; --kb: 0px; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 键盘弹起：输入条/评论/通话栏整体抬到键盘上方 */
  html.kb-open .inputbar { bottom: var(--kb); padding-bottom: 10px; }
  html.kb-open #stream { bottom: calc(var(--kb) + 118px); }
  html.kb-open #callbar { bottom: var(--kb); padding-bottom: 18px; }
  html.kb-open #bubble.call-sub { bottom: calc(var(--kb) + 102px); }
  html { background: #bfe3f2; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { touch-action: none; }
  .bg { position: fixed; inset: 0; background: #bfe3f2 center/cover no-repeat; z-index: -1;
    opacity: 0; transition: opacity .9s ease; }
  .bg.on { opacity: 1; }

  .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center;
    padding: calc(var(--safe-top) + 10px) 14px 10px; z-index: 10; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .back { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.75);
    color: #3a6b84; font-size: 17px; line-height: 34px; text-align: center; }
  .title { margin-left: 10px; color: #2c5a73; font-size: 17px; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,.6); white-space: nowrap; }
  .smart-wrap { display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.75); border-radius: 17px; padding: 5px 10px; }
  .right-group { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .smart-wrap span { font-size: 12px; color: #3a6b84; }
  .smart-wrap input { position: relative; width: 40px; height: 22px; appearance: none; background: #c9d8e0;
    border-radius: 11px; outline: none; transition: background .2s; }
  .smart-wrap input:checked { background: #4da3c7; }
  .smart-wrap input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .smart-wrap input:checked::after { left: 20px; }
  .cfg-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,.75);
    color: #3a6b84; font-size: 16px; line-height: 34px; text-align: center; }

  #tts-mask { position: fixed; inset: 0; background: rgba(20,45,60,.45); z-index: 30; display: none; }
  #tts-mask.show { display: flex; align-items: center; justify-content: center; }
  #tts-panel { width: 84%; max-width: 340px; background: #f4fafd; border-radius: 16px; padding: 16px;
    box-shadow: 0 8px 30px rgba(30,70,95,.3); }
  #tts-panel .tt { font-size: 15px; font-weight: 600; color: #2c5a73; margin-bottom: 10px; }
  #tts-panel label { display: block; font-size: 12px; color: #3a6b84; margin: 8px 0 3px; }
  #tts-panel input, #tts-panel select { width: 100%; border: 1px solid #b8d4e2; border-radius: 10px;
    padding: 8px 10px; font-size: 14px; background: #fff; color: #2c5a73; outline: none; }
  #tts-panel .row { display: flex; gap: 8px; margin-top: 14px; }
  #tts-panel .row button { flex: 1; border: none; border-radius: 10px; padding: 9px 0; font-size: 14px; }
  #mm-test { background: #e3f1f8; color: #2c5a73; }
  #mm-save { background: #4da3c7; color: #fff; }
  #mm-close { background: #eef3f6; color: #7a97a6; }
  #tts-panel .hint { font-size: 11px; color: #7a97a6; line-height: 1.6; margin-top: 10px; }
  .balRow { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 10px; font-size: 12px; color: #3a6b84; }
  #mm-balance { flex: 1; line-height: 1.4; }
  #mm-balance-refresh { border: none; border-radius: 10px; padding: 6px 10px;
    background: #e3f1f8; color: #2c5a73; font-size: 12px; white-space: nowrap; }


  /* removed */

  #bubble { position: fixed; left: 50%; top: 16%; transform: translateX(-50%) scale(.9); max-width: 78%;
    background: rgba(255,255,255,.92); color: #2c5a73; border-radius: 16px; padding: 10px 14px;
    font-size: 15px; line-height: 1.5; opacity: 0; transition: opacity .25s, transform .25s;
    box-shadow: 0 4px 14px rgba(60,110,140,.18); z-index: 9; pointer-events: none; }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border: 7px solid transparent; border-top-color: rgba(255,255,255,.92); border-bottom: none; }

  .inputbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
    padding: 10px 12px calc(var(--safe-bottom) + 10px); z-index: 10;
    background: linear-gradient(transparent, rgba(190,225,240,.85) 40%); }
  #msg { flex: 1; border: none; border-radius: 20px; padding: 10px 16px; font-size: 15px;
    background: rgba(255,255,255,.9); color: #2c5a73; outline: none; }
  #send { border: none; border-radius: 20px; padding: 0 18px; background: #4da3c7; color: #fff;
    font-size: 15px; white-space: nowrap; writing-mode: horizontal-tb; flex: 0 0 auto;
    min-width: 64px; display: flex; align-items: center; justify-content: center; }
  #send:disabled { background: #a8c6d4; }

  /* 直播评论流：右下角半透明滚动，不挡点击 */
  #stream { position: fixed; right: 10px; bottom: 118px; width: 58%; max-width: 248px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    z-index: 8; pointer-events: none; }
  #stream .st { max-width: 100%; background: rgba(255,255,255,.74); color: #2c5a73;
    border-radius: 12px; padding: 5px 9px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 2px 8px rgba(60,110,140,.12); word-break: break-word;
    animation: stIn .28s ease-out; }
  #stream .st.me { background: rgba(77,163,199,.86); color: #fff; }
  @keyframes stIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }


  #logBtn, #callBtn { width: 38px; height: 38px; flex: 0 0 auto; border: none; border-radius: 50%;
    background: rgba(255,255,255,.86); color: #3d7f9c; display: flex; align-items: center; justify-content: center; }
  #logBtn svg, #callBtn svg { width: 20px; height: 20px; }
  #callBtn { background: #4da3c7; color: #fff; box-shadow: 0 4px 14px rgba(40,120,150,.28); }
  .inputbar.hide { display: none; }

  #callbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: none;
    gap: 26px; align-items: flex-end; justify-content: center;
    padding: 18px 10px calc(var(--safe-bottom) + 18px);
    background: linear-gradient(transparent, rgba(0,0,0,.55) 42%); }
  #callbar.on { display: flex; }
  #callbar button { width: 58px; height: 58px; border: none; border-radius: 50%; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    color: #fff; background: rgba(255,255,255,.18); backdrop-filter: blur(14px); }
  #callbar button svg { width: 22px; height: 22px; }
  #callbar button span { font-size: 10px; line-height: 1; opacity: .9; }
  #callbar button.end { background: #e5484d; box-shadow: 0 6px 18px rgba(229,72,77,.35); }
  #callbar button.on { background: rgba(77,163,199,.85); }

  #callTop { position: fixed; top: calc(var(--safe-top) + 8px); left: 50%; transform: translateX(-50%);
    z-index: 13; display: none; text-align: center; color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,.55); pointer-events: none; }
  #callTop.on { display: block; }
  #callTop .name { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  #callTop .meta { font-size: 11px; opacity: .86; margin-top: 2px; }

  #callShade { position: fixed; inset: 0; z-index: 6; display: none; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.30), transparent 24%, transparent 62%, rgba(0,0,0,.62)); }
  #callShade.on { display: block; }

  /* 电脑版视频通话：右上角摄像头自拍小窗 */
  #callSelf { position: fixed; top: calc(var(--safe-top) + 58px); right: 14px; z-index: 11;
    width: 112px; height: 148px; border-radius: 14px; overflow: hidden; display: none;
    background: #0b1420; box-shadow: 0 10px 26px rgba(0,0,0,.4); }
  #callSelf.on { display: block; }
  #callSelf video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

  #bubble.call-sub { top: auto; bottom: calc(var(--safe-bottom) + 102px); max-width: 80%;
    background: rgba(0,0,0,.55); color: #fff; font-size: 13px; line-height: 1.45; border-radius: 14px;
    padding: 7px 12px; box-shadow: none; backdrop-filter: blur(8px); }
  #bubble.call-sub::after { display: none; }

  #streamSheet { position: fixed; inset: 0; background: rgba(224,242,249,.97); z-index: 20;
    display: none; flex-direction: column;
    padding: calc(var(--safe-top) + 14px) 14px 14px; }
  #streamSheet.on { display: flex; }
  #streamSheet .shHead { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; color: #2c5a73; font-size: 16px; font-weight: 600; }
  #streamSheet .shHead button { border: none; background: transparent; font-size: 24px; color: #7a97a6; }
  #streamList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  #streamList .sl { background: #fff; border-radius: 12px; padding: 8px 11px; font-size: 13px;
    line-height: 1.5; color: #2c5a73; box-shadow: 0 1px 4px rgba(60,110,140,.1); }
  #streamList .sl.me { background: #d7ecf6; }
  #streamList .sl b { display: block; font-size: 10px; color: #7a97a6; font-weight: 600; margin-bottom: 2px; }
</style>
</head>

</div>

<script>
(function () {
  var bubble = document.getElementById('bubble');
  var msg = document.getElementById('msg');
  var sendBtn = document.getElementById('send');
  var bubbleTimer = 0;
  var streamEl = document.getElementById('stream');
  var streamList = document.getElementById('streamList');
  var streamSheet = document.getElementById('streamSheet');
  var lastHerLine = '', lastMeLine = '';
  var smartOn = false;

  function loadSmartSetting(){
    fetch('/api/whale/settings', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (d) {
      smartOn = !!(d && d.smart);
      if (smartOn){
        fetch('/api/whale/brain/start', {method: 'POST'}).catch(function () {});
      }
    }).catch(function () {});
  }
  loadSmartSetting();

  var soul = new WhaleAvatar.LocalSoulAdapter();
  soul.onSpeak(function (s) {
    bubble.textContent = s.text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    var hold = Math.min(8000, 2200 + s.text.length * 120);
    bubbleTimer = setTimeout(function () { bubble.classList.remove('show'); }, hold);
    addStream('her', s.text);
    if (callActive) {
      herSpeakUntil = Date.now() + hold;
      clearTimeout(listenResumeTimer);
      try { Android.stopWorldListening(); } catch (e) {}
      listenResumeTimer = setTimeout(startListeningIfQuiet, hold + 280);
    }
  });

  // ---- 互动：点她不同部位、隔一会儿还会主动搭话 ----
  var REACT = {
    head: [
      ['唔……摸头的话，会变乖的哦。', 0.55, 0.35],
      ['咕～主人的手好暖，再摸一下嘛。', 0.6, 0.3],
      ['头发要被你揉乱啦，不过……不讨厌。', 0.4, 0.25]
    ],
    body: [
      ['呀！突然碰过来，尾巴都炸起来了。', 0.15, 0.6],
      ['干嘛啦，本鱼在认真发呆呢。', 0.1, 0.3],
      ['贴贴可以，但是要小声一点哦。', 0.5, 0.3]
    ],
    tail: [
      ['尾、尾巴不行！那里很敏感的啦！', 0.3, 0.75],
      ['尾巴甩到你了，对不起嘛。', 0.35, 0.2],
      ['再戳我就游走了哦……骗你的。', 0.45, 0.35]
    ]
  };
  var IDLE_LINES = [
    ['主人今天也在这里，我就安心啦。', 0.4, 0.2],
    ['海底现在很安静呢……我听得见你的呼吸。', 0.2, 0.1],
    ['要不要摸摸本鱼的头？本鱼不会躲的。', 0.5, 0.3],
    ['有点想你上次说的那个吃的，叫什么来着？', 0.25, 0.25],
    ['本鱼在这里哦，不会走的。', 0.55, 0.15],
    ['发呆的时候，脑子里都是主人。', 0.6, 0.3]
  ];
  var lastTapAt = 0, lastLine = '';
  function say(line, force) {
    if (!line) return;
    if (!force && line[0] === lastLine) return;
    lastLine = line[0];
    soul.injectReply(line[0], line[1], line[2]);
  }
  function onAvatarEvent(ev) {
    if (!ev) return;
    if (ev.type === 'debug'){ window.__dbg = ev.payload; return; }
    if (ev.type === 'ready'){ window.__ready = ev.payload; return; }
    if (ev.type === 'error'){ window.__err = ev.payload; return; }
    if (ev.type === 'head_hug'){ lastTapAt = Date.now(); say(['太、太近了啦……不过可以再摸一下。', 0.62, 0.5], true); return; }
    if (ev.type === 'annoyed'){ lastTapAt = Date.now(); say(['你再戳，我真的要生气了咕！', -0.5, 0.6], true); return; }
    if (ev.type === 'lonely'){ say(['你还在吗……我一个人有点安静。', -0.3, -0.1], true); return; }
    if (ev.type !== 'tap') return;
    window.__tap = ev.payload;
    var now = Date.now();
    if (now - lastTapAt < 1400) return;
    lastTapAt = now;
    var zone = (ev.payload && ev.payload.zone) || 'body';
    var pool = REACT[zone] || REACT.body;
    say(pool[Math.floor(Math.random() * pool.length)]);
  }

  try { localStorage.removeItem('whale.model'); } catch (e) {}
  var mountOpts = {
    container: document.getElementById('stage'),
    modelUrl: encodeURI('whale/model/大肥鱼.model3.json'),
    soul: soul,
    pixelRatioCap: 2,
    onEvent: onAvatarEvent
  };
  var avatar = WhaleAvatar.mount(mountOpts);
  window.__whale = avatar; // 调试用：CDP 里可直接读参数/表情槽位

  /* 2D 背景：按她所在地的天气 + 她那边的时间，在 12 张背景之间淡入切换 */
  (function weatherBackground(){
    var front = 'A', key = '';
    function periodOf(text){
      var m = /^(\d{1,2})/.exec(String(text || ''));
      var h = m ? parseInt(m[1], 10) : new Date().getHours();
      if (!isFinite(h)) h = new Date().getHours();
      if (h >= 5 && h < 8) return 'dawn';
      if (h >= 8 && h < 17) return 'day';
      if (h >= 17 && h < 20) return 'dusk';
      return 'night';
    }
    function weatherOf(text){
      text = String(text || '');
      if (/雪/.test(text)) return 'snow';
      if (/雨|雷|暴雨|阵雨/.test(text)) return 'rain';
      return 'clear';
    }
    function show(url){
      var a = document.getElementById('bgA');
      var b = document.getElementById('bgB');
      if (!a || !b) return;
      var next = front === 'A' ? b : a;
      var old = front === 'A' ? a : b;
      next.style.backgroundImage = 'url("' + url + '")';
      next.classList.add('on');
      old.classList.remove('on');
      front = front === 'A' ? 'B' : 'A';
    }
    function apply(period, weather){
      var nextKey = period + '-' + weather;
      if (nextKey === key) return;
      key = nextKey;
      var img = new Image();
      img.onload = function () { show('whale/bg/' + nextKey + '.jpg'); };
      img.src = 'whale/bg/' + nextKey + '.jpg';
    }
    function pull(){
      fetch('/api/world', {cache: 'no-store'})
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var wd = (d && d.her_weather) || {};
          apply(periodOf(d && d.her_time), weatherOf(wd.text));
        })
        .catch(function () { apply(periodOf(''), 'clear'); });
    }
    window.__bgDebug = function () { return key; };
    setTimeout(pull, 500);

  callLensBtn.onclick = toggleLens;
  callLookBtn.onclick = lookNow;

  /* 视线跟随鼠标：桌面端每帧最多算一次；视频通话时让位给人脸跟踪 */
  (function bindGaze(){
    var raf = 0, px = 0, py = 0, inside = false;
    function aim(){
      if (!avatar || !avatar.lookAt || callActive) return;
      var stage = document.getElementById('stage');
      if (!stage) return;
      var r = stage.getBoundingClientRect();
      var nx = ((px - r.left) / Math.max(1, r.width)) * 2 - 1;
      var ny = ((py - r.top) / Math.max(1, r.height)) * 2 - 1;
      avatar.lookAt(
        Math.max(-1, Math.min(1, nx)),
        Math.max(-1, Math.min(1, ny)),
        0.75
      );
    }
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      px = e.clientX;
      py = e.clientY;
      inside = true;
      if (raf) return;
      raf = requestAnimationFrame(function () { raf = 0; aim(); });
    }, {passive: true});
    /* 鼠标停住时也保持注视；lookAt 的 hold 只有 0.2s，所以定时补一拍 */
    setInterval(function () { if (inside) aim(); }, 180);
    document.addEventListener('mouseleave', function () {
      inside = false;
      if (avatar && avatar.clearLook && !callActive) {
        try { avatar.clearLook(); } catch (e) {}
      }
    });
  })();

  /* ESC：先关浮层/音量面板/通话，再返回上一页 */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' && e.keyCode !== 27) return;
    var mask = document.getElementById('tts-mask');
    if (mask && mask.classList.contains('show')) {
      e.preventDefault();
      mask.classList.remove('show');
      return;
    }
    var sheet = document.getElementById('streamSheet');
    if (sheet && sheet.classList.contains('on')) {
      e.preventDefault();
      sheet.classList.remove('on');
      return;
    }
    if (callActive) {
      e.preventDefault();
      try { callEndBtn.click(); } catch (err) {}
      return;
    }
    e.preventDefault();
    var back = document.querySelector('.back');
    if (back) back.click();
  }, true);

  window.__onVoiceResult = function (r) {
    if (!callActive || callPaused) return;
    var text = r && r.ok ? String(r.text || '').trim() : '';
    if (!text) return;
    var now = Date.now();
    if (text === lastHeardText && now - lastHeardAt < 2500) return;
    lastHeardText = text;
    lastHeardAt = now;
    msg.value = text;
    send();
  };

  window.__worldCall = {
    onReady: function () {
      startListeningIfQuiet();
    },
    onFace: function (p) {
      if (!callActive || !callFront || callPaused) return;
      if (!avatar) return;
      if (p && p.visible && avatar.lookAt) {
        var x = Math.max(-1, Math.min(1, Number(p.x) || 0));
        var y = Math.max(-1, Math.min(1, Number(p.y) || 0));
        avatar.lookAt(x, y, 0.75);
      } else if (avatar.clearLook) {
        try { avatar.clearLook(); } catch (e) {}
      }
    },
    onScene: function (p) {
      if (!callActive || !p) return;
      if (p.place) {
        currentPlace = String(p.place);
        if (!callPaused && callStateText) callStateText.textContent = callStateBase();
      }
      if (p.ok && p.text) {
        pushLog('assistant', p.text);
        soul.injectReply(p.text, p.valence || 0.2, p.arousal || 0.3);
        if (p.gesture && avatar && avatar.playGesture) {
          try { avatar.playGesture(p.gesture, 2.2); } catch (e) {}
        }
      }
    },
    onFocus: function (p) {
      if (!callActive) return;
      callBubble('她看向你点的地方了。');
    },
    onError: function (p) {
      var code = p && p.code;
      callBubble(code === 'camera_denied' ? '没有相机权限，先用文字聊吧' : '摄像头暂时打不开，先用文字聊吧');
      endCall(true);
    },
    onEnded: function () {}
  };

  window.__onResume = function () {
    if (callActive && !callPaused) startListeningIfQuiet();
  };

  window.__whaleBack = function () {
    if (callActive) {
      endCall(false);
      return;
    }
    // 回到主页的模块选择卡带，而不是浏览器历史
    location.href = '/index.html?home=1';
  };

  window.addEventListener('pagehide', function () {
    if (!callActive) return;
    var sid = callSession;
    callActive = false;
    callSession = '';
    clearTimeout(listenResumeTimer);
    try { Android.stopWorldListening(); } catch (e) {}
    try { Android.endWorldCall(); } catch (e) {}
    clearInterval(callTimer);
    if (sid) {
      try {
        var blob = new Blob([JSON.stringify({ session: sid })], { type: 'application/json' });
        if (navigator.sendBeacon) navigator.sendBeacon('/api/world/stop', blob);
      } catch (e) {}
    }
  });

  setTimeout(function () { soul.injectReply('你来看我啦咕～', 0.3, 0.2); }, 1200);

  /* ---------- 首次进入：预合成固定台词，之后不再花 MiniMax 额度 ---------- */
  function precacheVoices() {
    try {
      if (!voiceOn) return;
      if (localStorage.getItem('whale.pre') === '1') return;
      if (!(window.Android && Android.precacheCloud && Android.hasCloudTts && Android.hasCloudTts())) return;
      var lines = [], seen = {};
      function push(l) { if (!l || seen[l]) return; seen[l] = 1; lines.push(l); }
      Object.keys(REACT).forEach(function (z) {
        REACT[z].forEach(function (x) { push(x[0]); });
      });
      IDLE_LINES.forEach(function (x) { push(x[0]); });
      push('太、太近了啦……不过可以再摸一下。');
      push('你再戳，我真的要生气了咕！');
      push('你还在吗……我一个人有点安静。');
      Android.precacheCloud(JSON.stringify(lines.slice(0, 16)));
      localStorage.setItem('whale.pre', '1');
    } catch (e) {}
  }
  setTimeout(precacheVoices, 5000);
  /* 分层返回：先关页内浮层，再回上一页 */
  window.__androidBack = function () {
    var sheet = document.getElementById('streamSheet');
    if (sheet && sheet.classList.contains('on')) { sheet.classList.remove('on'); return true; }
    var mask = document.getElementById('tts-mask');
    if (mask && mask.classList.contains('show')) { mask.classList.remove('show'); return true; }
    // 退出小鲸鱼页：回到主页并打开模块选择卡带
    location.href = '/index.html?home=1';
    return true;
  };
  setTimeout(loadStream, 1600);
})();
</script>
